<h2>Produits</h2>

<form #formProd="ngForm" (ngSubmit)="formProd.valid && salvar()" class="form">
  <input
    [(ngModel)]="novo.nome"
    name="nome"
    placeholder="Nom *"
    required
    minlength="2"
    #nome="ngModel" />
  <span class="hint" *ngIf="nome.invalid && nome.touched">Nom obligatoire (min. 2 caractères)</span>

  <input [(ngModel)]="novo.descricao" name="descricao" placeholder="Description" />

  <input
    [(ngModel)]="novo.preco"
    name="preco"
    type="number"
    step="0.01"
    min="0"
    required />

  <input
    [(ngModel)]="novo.quantidade"
    name="quantidade"
    type="number"
    min="0"
    required />

  <select [(ngModel)]="categoriaId" name="categoria">
    <option [ngValue]="null">-- Catégorie --</option>
    <option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.nome }}</option>
  </select>

  <select [(ngModel)]="fornecedorId" name="fornecedor">
    <option [ngValue]="null">-- Fournisseur --</option>
    <option *ngFor="let f of fornecedores" [ngValue]="f.id">{{ f.nome }}</option>
  </select>

  <button type="submit" [disabled]="formProd.invalid">
    {{ editandoId ? 'Mettre à jour' : 'Ajouter' }}
  </button>
  <button type="button" *ngIf="editandoId" (click)="cancelar()">Annuler</button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>Prix</th><th>Stock</th><th>Catégorie</th><th>Fournisseur</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of produtos">
      <td>{{ p.id }}</td>
      <td>{{ p.nome }}</td>
      <td>{{ p.preco | number:'1.2-2' }}</td>
      <td>{{ p.quantidade }}</td>
      <td>{{ p.categoria?.nome }}</td>
      <td>{{ p.fornecedor?.nome }}</td>
      <td>
        <button (click)="editar(p)">Éditer</button>
        <button (click)="excluir(p.id!)">Supprimer</button>
      </td>
    </tr>
    <tr *ngIf="produtos.length === 0"><td colspan="7">Aucun produit</td></tr>
  </tbody>
</table>
